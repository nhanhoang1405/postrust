name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      POSTRUST_CLIPBOARD: internal
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libwayland-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: HTTP terminal smoke test
        run: python3 scripts/smoke_tui.py
      - name: Workspace terminal smoke test
        run: python3 scripts/smoke_workspaces.py
      - run: cargo build --release --locked
      - run: cargo package --locked

  minimum-rust:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      POSTRUST_CLIPBOARD: internal
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libwayland-dev
      - name: Install minimum Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo test --locked
