[package]
name = "postrust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An approachable terminal HTTP workbench"
license = "MIT"
repository = "https://github.com/nhanhoang1405/postrust"
readme = "README.md"
keywords = ["http", "api", "terminal", "tui", "postman"]
categories = ["command-line-utilities", "web-programming::http-client"]
include = ["src/**", "scripts/*.py", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
crossterm = "0.29"
directories = "6"
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
